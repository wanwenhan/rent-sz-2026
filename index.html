<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<title>看房对比 · 深圳</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0f1115; --card:#171a21; --card2:#1e222b; --line:#272c36;
    --ink:#f2f4f8; --ink2:#9aa3b2; --ink3:#6b7484;
    --accent:#5ee0a0; --warn:#ffb454; --bad:#ff6b6b; --info:#6aa8ff;
  }
  body{
    background:var(--bg); color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",Arial,sans-serif;
    padding:14px 14px calc(90px + env(safe-area-inset-bottom));
    max-width:760px; margin:0 auto;
  }
  h1{font-size:17px;font-weight:600;letter-spacing:.3px}
  .sub{color:var(--ink3);font-size:12px;margin-top:3px;line-height:1.6}
  header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;gap:10px}

  .crit{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--ink2);line-height:1.8}
  .crit b{color:var(--accent);font-weight:600}

  .stats{display:flex;gap:8px;margin-bottom:12px}
  .stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 11px}
  .stat b{display:block;font-size:17px;font-weight:650;letter-spacing:-.2px}
  .stat span{font-size:11px;color:var(--ink3)}

  .tabs{display:flex;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
  .tabs button{flex:1;background:none;border:0;color:var(--ink2);font-size:13px;padding:8px 0;border-radius:9px;font-family:inherit}
  .tabs button.on{background:var(--card2);color:var(--ink)}

  .chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--ink2);
    font-size:12.5px;padding:6px 11px;border-radius:20px;font-family:inherit}
  .chip.on{background:var(--ink);color:#0f1115;border-color:var(--ink);font-weight:600}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px}
  .card.done{opacity:.55}
  .row1{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .name{font-size:15.5px;font-weight:640;letter-spacing:-.1px}
  .addr{color:var(--ink3);font-size:12px;margin-top:3px}
  .addr a{color:var(--info);text-decoration:none;margin-left:6px}
  .badge{font-size:10.5px;font-weight:600;border:1px solid;border-radius:20px;padding:1px 7px;margin-left:7px;vertical-align:2px}
  .pill{font-size:11px;padding:3px 8px;border-radius:20px;white-space:nowrap;border:1px solid var(--line)}
  .p-待看{color:var(--warn);border-color:#4a3a1e;background:#2a2113}
  .p-已看{color:var(--info);border-color:#1e3550;background:#14202e}
  .p-淘汰{color:var(--ink3);border-color:var(--line);background:#1a1d24}
  .p-选中{color:var(--accent);border-color:#1e4a38;background:#102b21}

  .nums{display:flex;align-items:flex-end;gap:14px;margin:11px 0 9px;flex-wrap:wrap}
  .big{font-size:23px;font-weight:680;letter-spacing:-.6px;line-height:1}
  .big small{font-size:12px;color:var(--ink3);font-weight:400;margin-left:3px;letter-spacing:0}
  .unit{color:var(--accent)}
  .coord{font-size:11.5px;color:var(--ink3);margin:-2px 0 8px;font-variant-numeric:tabular-nums}
  .coord a{color:var(--info);text-decoration:none;margin-left:6px}
  .meta{display:flex;flex-wrap:wrap;gap:5px}
  .tag{font-size:11.5px;color:var(--ink2);background:var(--card2);border-radius:6px;padding:3px 7px}
  .tag.hi{color:var(--accent);background:#102b21}
  .tag.warn{color:var(--warn);background:#2a2113}
  .tag.bad{color:#ff9a9a;background:#2c1616}

  details.sec{border-top:1px solid var(--line);margin-top:10px;padding-top:9px}
  details.sec summary{list-style:none;cursor:pointer;font-size:12.5px;color:var(--ink2);display:flex;justify-content:space-between;align-items:center}
  details.sec summary::-webkit-details-marker{display:none}
  details.sec summary::after{content:"＋";color:var(--ink3);font-size:13px}
  details.sec[open] summary{color:var(--accent)}
  details.sec[open] summary::after{content:"－"}
  details.sec .body{font-size:12.5px;color:var(--ink2);line-height:1.75;margin-top:9px}
  .ask{list-style:none}
  .ask li{padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.07);display:flex;gap:8px;font-size:12.5px;color:var(--ink2)}
  .ask li:last-child{border-bottom:0}
  .ask input{accent-color:#5ee0a0;margin-top:3px}

  .acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
  .acts a,.acts button{flex:0 0 auto;font-size:12px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);
    background:var(--card2);color:var(--ink2);text-decoration:none;font-family:inherit}
  .acts button.on{background:var(--ink);color:#0f1115;border-color:var(--ink)}

  .empty{text-align:center;color:var(--ink3);padding:50px 20px;font-size:13px;line-height:1.8}

  /* compare */
  .cmp{overflow-x:auto;-webkit-overflow-scrolling:touch;background:var(--card);border:1px solid var(--line);border-radius:14px}
  table{border-collapse:collapse;width:100%;min-width:720px;font-size:12.5px}
  th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
  th{color:var(--ink3);font-weight:500;font-size:11.5px;background:var(--card2);position:sticky;top:0}
  td.nm{font-weight:600;color:var(--ink)}
  tr:last-child td{border-bottom:0}
  .best{color:var(--accent);font-weight:600}
  .cmpnote{font-size:11.5px;color:var(--ink3);margin:8px 2px 0;line-height:1.7}

  /* route */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
  .field{display:flex;align-items:center;gap:10px;margin-bottom:9px}
  .field label{font-size:12.5px;color:var(--ink3);width:64px;flex:0 0 auto}
  .field input,.field select{flex:1;background:var(--card2);border:1px solid var(--line);color:var(--ink);
    border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:inherit}
  .stop{display:flex;gap:9px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
  .stop:last-child{border-bottom:0}
  .stop .idx{width:22px;height:22px;flex:0 0 auto;border-radius:50%;background:var(--card2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink2)}
  .stop .txt{flex:1;min-width:0}
  .stop .t1{font-size:13.5px;font-weight:600}
  .stop .t2{font-size:11.5px;color:var(--ink3);margin-top:2px}
  .stop .move{display:flex;flex-direction:column;gap:3px}
  .stop .move button{background:var(--card2);border:1px solid var(--line);color:var(--ink2);border-radius:6px;
    width:26px;height:22px;font-size:10px;font-family:inherit}
  textarea{width:100%;height:170px;background:var(--card2);border:1px solid var(--line);color:var(--ink);
    border-radius:10px;padding:10px;font:12px/1.6 ui-monospace,Menlo,monospace;resize:vertical}
  .btn{background:var(--ink);color:#0f1115;border:0;border-radius:10px;padding:11px 16px;font-size:14px;
    font-weight:600;font-family:inherit;width:100%;margin-top:8px}
  .btn.ghost{background:var(--card2);color:var(--ink2);border:1px solid var(--line);font-weight:500}
  .imgrow{display:flex;align-items:center;gap:10px;margin:9px 0 2px}
  .mini{width:56px;height:56px;object-fit:cover;object-position:top;border-radius:8px;cursor:zoom-in;background:#1e222b;flex:0 0 auto}
  .minihint{font-size:11.5px;color:var(--ink3)}
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.94);display:none;z-index:99;align-items:center;justify-content:center;padding:12px}
  #lightbox.on{display:flex}
  #lightbox img{max-width:100%;max-height:100%;border-radius:8px}
  .links{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}
  .links a{font-size:12px;padding:6px 10px;border-radius:8px;background:var(--card2);border:1px solid var(--line);color:var(--ink2);text-decoration:none}
  .rev{font-size:12.5px;color:var(--ink2);line-height:1.7;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.06)}
  .rev:last-child{border-bottom:0}
  .src{display:inline-block;font-size:10.5px;color:var(--ink3);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-right:6px}
  .disclaim{font-size:11px;color:var(--ink3);margin-top:8px;line-height:1.6}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<header>
  <div>
    <h1>看房对比 · 深圳</h1>
    <div class="sub" id="cityline">加载中</div>
  </div>
</header>

<div class="crit" id="crit"></div>

<div class="crit" id="gask" style="display:none"></div>

<div class="stats">
  <div class="stat"><b id="s-count">0</b><span>在选套数</span></div>
  <div class="stat"><b id="s-avg">—</b><span>平均单价 元/㎡</span></div>
  <div class="stat"><b id="s-low">—</b><span>最低月租</span></div>
</div>

<div class="tabs">
  <button id="tab-list" class="on" onclick="setTab('list')">房源</button>
  <button id="tab-cmp" onclick="setTab('cmp')">对比</button>
  <button id="tab-map" onclick="setTab('map')">地图</button>
  <button id="tab-route" onclick="setTab('route')">看房路线</button>
</div>

<section id="view-list">
  <div class="chips" id="sortchips">
    <button class="chip on" data-sort="unit">单价 ↑</button>
    <button class="chip" data-sort="price">月租 ↑</button>
    <button class="chip" data-sort="commute">通勤 ↑</button>
    <button class="chip" data-sort="quiet">安静 ↓</button>
    <button class="chip" data-sort="area">面积 ↓</button>
  </div>
  <div class="chips" id="statuschips">
    <button class="chip on" data-status="all">全部</button>
    <button class="chip" data-status="待看">待看</button>
    <button class="chip" data-status="已看">已看</button>
    <button class="chip" data-status="淘汰">淘汰</button>
    <button class="chip" data-status="选中">选中</button>
  </div>
  <div id="cards"></div>
</section>

<section id="view-cmp" style="display:none">
  <div class="cmp" id="cmptable"></div>
  <div class="cmpnote" id="cmpnote"></div>
</section>

<section id="view-map" style="display:none">
  <div class="panel" style="padding:10px">
    <div class="chips" style="padding-bottom:8px">
      <button class="chip on" id="mm-osm" onclick="setMapMode('osm')">在线地图</button>
      <button class="chip" id="mm-svg" onclick="setMapMode('svg')">示意图（离线）</button>
    </div>
    <div id="leafmap" style="height:430px;border-radius:12px;display:none"></div>
    <div id="mapwrap" style="width:100%;overflow:hidden"></div>
    <div class="cmpnote" id="mapnote"></div>
  </div>
</section>

<section id="view-route" style="display:none">
  <div class="panel">
    <div class="field"><label>起点</label><input id="r-start" placeholder="酒店 / 地铁站" value=""></div>
    <div class="field"><label>出发</label><input id="r-time" type="time" value="09:30"></div>
    <div class="field"><label>每套停留</label>
      <select id="r-dur"><option>20</option><option selected>30</option><option>40</option><option>50</option></select>
    </div>
    <div class="field"><label>同片区</label>
      <select id="r-same"><option>5</option><option selected>10</option><option>15</option></select>
    </div>
    <div class="field"><label>跨片区</label>
      <select id="r-cross"><option>15</option><option selected>25</option><option>35</option><option>45</option></select>
    </div>
    <button class="btn ghost" onclick="autoOrder()">按片区自动排序</button>
  </div>
  <div class="panel" id="route-list"></div>
  <div class="panel">
    <div style="font-size:12.5px;color:var(--ink3);margin-bottom:8px">路书（可直接复制给司机/发给朋友）</div>
    <textarea id="r-text" readonly></textarea>
    <button class="btn" onclick="copyText()">复制路书</button>
  </div>
</section>

/* ---------- 地图 ---------- */
function distKm(a, b) {
  const R = 6371, toR = Math.PI / 180;
  const dLat = (b.lat - a.lat) * toR, dLng = (b.lng - a.lng) * toR;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(a.lat * toR) * Math.cos(b.lat * toR) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

/* WGS84 → GCJ02：高德瓦片用 GCJ02 坐标系，直接画 WGS84 坐标会偏移约 500m */
function outOfChina(lat, lng) { return !(lng > 73.66 && lng < 135.05 && lat > 3.86 && lat < 53.55); }
function tLat(x, y) {
  let r = -100 + 2 * x + 3 * y + 0.2 * y * y + 0.1 * x * y + 0.2 * Math.sqrt(Math.abs(x));
  r += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
  r += (20 * Math.sin(y * Math.PI) + 40 * Math.sin(y / 3 * Math.PI)) * 2 / 3;
  r += (160 * Math.sin(y / 12 * Math.PI) + 320 * Math.sin(y * Math.PI / 30)) * 2 / 3;
  return r;
}
function tLng(x, y) {
  let r = 300 + x + 2 * y + 0.1 * x * x + 0.1 * x * y + 0.1 * Math.sqrt(Math.abs(x));
  r += (20 * Math.sin(6 * x * Math.PI) + 20 * Math.sin(2 * x * Math.PI)) * 2 / 3;
  r += (20 * Math.sin(x * Math.PI) + 40 * Math.sin(x / 3 * Math.PI)) * 2 / 3;
  r += (150 * Math.sin(x / 12 * Math.PI) + 300 * Math.sin(x / 30 * Math.PI)) * 2 / 3;
  return r;
}
function wgs2gcj(lat, lng) {
  if (outOfChina(lat, lng)) return [lat, lng];
  const a = 6378245, ee = 0.00669342162296594323;
  let dLat = tLat(lng - 105, lat - 35), dLng = tLng(lng - 105, lat - 35);
  const rad = lat / 180 * Math.PI;
  let magic = Math.sin(rad); magic = 1 - magic * magic;
  const sq = Math.sqrt(magic);
  dLat = (dLat * 180) / ((a * (1 - ee)) / (magic * sq) * Math.PI);
  dLng = (dLng * 180) / (a / sq * Math.cos(rad) * Math.PI);
  return [lat + dLat, lng + dLng];
}

let leafMap = null;

function setMapMode(mode) {
  const osm = document.getElementById("leafmap");
  const svgBox = document.getElementById("mapwrap");
  const b1 = document.getElementById("mm-osm"), b2 = document.getElementById("mm-svg");

}

function initLeaf() {
  const off = SEED.office;
  const el = document.getElementById("leafmap");
  if (!leafMap) {
    const oc = wgs2gcj(off.lat, off.lng);
    leafMap = L.map(el, { scrollWheelZoom: true }).setView(oc, 12);
    L.tileLayer("https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}", {
      subdomains: ["1", "2", "3", "4"], maxZoom: 18, attribution: "高德地图"
    }).addTo(leafMap);
    L.circleMarker(oc, { radius: 9, color: "#0f1115", weight: 2, fillColor: "#ffb454", fillOpacity: 1 })
      .addTo(leafMap).bindPopup("<b>留仙洞 · 公司</b>");
    [2, 5, 10].forEach(r => L.circle(oc, {
      radius: r * 1000, color: "#8891a0", weight: 1, fill: false, dashArray: "4 6"
    }).addTo(leafMap).bindPopup(r + "km 圈"));
    leafMap._markers = [];
  }
  (leafMap._markers || []).forEach(m => leafMap.removeLayer(m));
  const list = data.listings.filter(l => l.lat && l.lng && l.status !== "淘汰");
  leafMap._markers = list.map(l => {
    const d = distKm(SEED.office, l);
    const sc = scoreOf(l), tr = tierOf(sc);
    const c = tr.c;
    const up = l.area ? Math.round(l.price / l.area) : "—";
    return L.circleMarker(wgs2gcj(l.lat, l.lng), {
      radius: 7, color: "#0f1115", weight: 2, fillColor: c, fillOpacity: .95
    }).addTo(leafMap).bindPopup(
      "<b>" + esc(l.name) + "</b> " + sc.toFixed(1) + " · " + tr.k + "<br>" +
      (l.area || "?") + "㎡ · " + money(l.price) + "/月 · " + up + " 元/㎡<br>" +
      "通勤约 " + l.commute + " 分 · 距公司 " + d.toFixed(1) + "km"
    );
  });
  setTimeout(function () { leafMap.invalidateSize(); }, 120);
}

render.map = function () {
  const box = document.getElementById("mapwrap");
  if (!box) return;
  const off = SEED.office;
  const list = data.listings.filter(l => l.lat && l.lng && l.status !== "淘汰");
  if (!off || !list.length) { box.innerHTML = '<div class="empty">暂无坐标</div>'; return; }

  const W = 340, H = 340, PAD = 34;
  const mPerLat = 110540;
  const mPerLng = 111320 * Math.cos(off.lat * Math.PI / 180);
  const pts = list.map(l => ({
    l,
    xm: (l.lng - off.lng) * mPerLng,
    ym: -(l.lat - off.lat) * mPerLat,
    d: distKm(off, l)
  }));
  const xs = pts.map(p => p.xm).concat([0]);
  const ys = pts.map(p => p.ym).concat([0]);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const span = Math.max(maxX - minX, maxY - minY) * 1.18 || 1000;
  const cx = (minX + maxX) / 2, cy = (minY + maxY) / 2;
  const k = (W - PAD * 2) / span;
  const P = (xm, ym) => [W / 2 + (xm - cx) * k, H / 2 + (ym - cy) * k];

  const maxKm = Math.max(...pts.map(p => p.d));
  const rings = [1, 2, 5, 10].filter(r => r <= maxKm * 1.25);
  const [ox, oy] = P(0, 0);   // 公司（留仙洞）= 投影原点

  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block;background:#12151c;border-radius:12px">`;
  svg += `<rect width="${W}" height="${H}" fill="#12151c"/>`;
  rings.forEach(r => {
    svg += `<circle cx="${ox}" cy="${oy}" r="${r * 1000 * k}" fill="none" stroke="#272c36" stroke-dasharray="3 4"/>`;
    svg += `<text x="${ox + 3}" y="${oy - r * 1000 * k - 3}" fill="#4a5260" font-size="8">${r}km</text>`;
  });
  pts.forEach(p => {
    const [x, y] = P(p.xm, p.ym);
    svg += `<line x1="${ox}" y1="${oy}" x2="${x}" y2="${y}" stroke="#2a3040" stroke-width="1"/>`;
  });
  svg += `<circle cx="${ox}" cy="${oy}" r="7" fill="#ffb454"/>`;
  svg += `<text x="${ox}" y="${oy - 11}" fill="#ffb454" font-size="9.5" text-anchor="middle" font-weight="600">留仙洞·公司</text>`;

  pts.sort((a, b) => b.d - a.d).forEach(p => {
    const [x, y] = P(p.xm, p.ym);
    const psc = scoreOf(p.l), ptr = tierOf(psc);
    const c = ptr.c;
    svg += `<g onclick="jumpTo('${p.l.id}')" style="cursor:pointer">`;
    svg += `<title>${esc(p.l.name)} ${psc.toFixed(1)} ${ptr.k}｜${p.l.area}㎡｜${money(p.l.price)}/月｜距公司 ${p.d.toFixed(1)}km</title>`;
    svg += `<circle cx="${x}" cy="${y}" r="5.5" fill="${c}" stroke="#0f1115" stroke-width="1.5"/>`;
    const anchor = x > W * 0.7 ? "end" : "start";
    const dx = anchor === "end" ? -8 : 8;
    svg += `<text x="${x + dx}" y="${y + 3}" fill="#c9d1de" font-size="8.5" text-anchor="${anchor}">${esc(p.l.name.slice(0, 8))} ${p.d.toFixed(1)}km</text>`;
    svg += `</g>`;
  });
  [["#5ee0a0", "推荐"], ["#6aa8ff", "可考虑"], ["#ffb454", "观望"], ["#8b93a3", "不推荐"]].forEach(function (it, i) {
    const bx = 16 + i * 52;
    svg += `<circle cx="${bx}" cy="${H - 14}" r="4" fill="${it[0]}"/><text x="${bx + 8}" y="${H - 11}" fill="#6b7484" font-size="8">${it[1]}</text>`;
  });
  svg += `</svg>`;
  box.innerHTML = svg;
  document.getElementById("mapnote").textContent =
    "示意图（离线模式）：按经纬度等距投影，虚线圆圈为距公司 1/2/5/10km。" + (SEED.coordNote || "");
};

  if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); el.style.outline = "2px solid #5ee0a0"; setTimeout(() => el.style.outline = "", 1600); }
}

/* ---------- 路线 ---------- */
let order = null;
function candidates() { return data.listings.filter(l => l.status === "待看" || l.status === "已看"); }

function autoOrder() {
  const arr = candidates().slice();
  const byArea = {};
  arr.forEach(l => { const k = l.district || "未分区"; (byArea[k] = byArea[k] || []).push(l); });
  const groups = Object.keys(byArea).sort((a, b) => byArea[b].length - byArea[a].length);
  const out = [];
  groups.forEach(k => out.push(...byArea[k].sort((a, b) => unitPrice(a) - unitPrice(b))));
  order = out.map(l => l.id);
  render.route();
}

function currentOrder() {
  const ids = order || candidates().map(l => l.id);
  const map = new Map(data.listings.map(l => [l.id, l]));
  return ids.map(id => map.get(id)).filter(Boolean);
}

render.route = function () {
  const box = document.getElementById("route-list");
  if (!box) return;
  const list = currentOrder();
  if (!list.length) {
    box.innerHTML = '<div class="empty">没有待看房源</div>';
    document.getElementById("r-text").value = "";
    return;
  }
  box.innerHTML = list.map((l, i) => `<div class="stop">
      <div class="idx">${i + 1}</div>
      <div class="txt">
        <div class="t1">${esc(l.name)}</div>
        <div class="t2">${esc(l.address)}${l.district ? " · " + esc(l.district) : ""}</div>
      </div>
      <div class="move">
        <button onclick="moveStop(${i},-1)">▲</button>
        <button onclick="moveStop(${i},1)">▼</button>
      </div>
    </div>`).join("");
  document.getElementById("r-text").value = buildRouteText(list);
};

function moveStop(i, d) {
  const ids = currentOrder().map(l => l.id);
  const j = i + d;
  if (j < 0 || j >= ids.length) return;
  const tmp = ids[i]; ids[i] = ids[j]; ids[j] = tmp;
  order = ids;
  render.route();
}

function hhmm(extraMins) {
  const v = document.getElementById("r-time").value || "09:30";
  const parts = v.split(":");
  let t = parseInt(parts[0], 10) * 60 + parseInt(parts[1], 10) + extraMins;
  const hh = String(Math.floor(t / 60) % 24).padStart(2, "0");
  const mm = String(Math.round(t % 60)).padStart(2, "0");
  return hh + ":" + mm;
}

function buildRouteText(list) {
  const dur = +document.getElementById("r-dur").value;
  const same = +document.getElementById("r-same").value;
  const cross = +document.getElementById("r-cross").value;
  const start = document.getElementById("r-start").value || "起点";
  let t = 0;
  const out = [];
  out.push("看房路线 · " + data.city + " · 共 " + list.length + " 套");
  out.push("起点：" + start + "　出发 " + (document.getElementById("r-time").value || "09:30"));
  out.push("");
  list.forEach((l, i) => {
    const prev = list[i - 1];
    const travel = i === 0 ? cross : (prev && prev.district === l.district ? same : cross);
    t += travel;
    const arrive = hhmm(t);
    t += dur;
    const leave = hhmm(t);
    out.push((i + 1) + ". " + arrive + "–" + leave + "　" + l.name);
    out.push("   " + l.address);
    out.push("   " + (l.area || "?") + "㎡　" + (l.price ? money(l.price) + "/月" : "价格待补") +
             "　单价 " + (isFinite(unitPrice(l)) ? Math.round(unitPrice(l)) : "?") + " 元/㎡" +
             "　安静 " + stars(l.quiet));
    out.push("");
  });
  out.push("预计结束 " + hhmm(t));
  return out.join("\n");
}

function copyText() {
  const ta = document.getElementById("r-text");
  ta.select(); ta.setSelectionRange(0, 99999);
  try { document.execCommand("copy"); } catch (e) {}
  if (navigator.clipboard) navigator.clipboard.writeText(ta.value).catch(function () {});
  alert("已复制路书");
}

["r-time","r-dur","r-same","r-cross","r-start"].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener("change", function () { render.route(); });
});

render();
if (location.hash) {
  const h = location.hash.replace('#', '');
  if (['map','cmp','route'].indexOf(h) > -1) setTab(h);
}
</script>
